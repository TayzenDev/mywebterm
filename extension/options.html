<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mywebterm — tab grouping</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { max-width: 34rem; margin: 1rem; }
    label { display: block; margin: 0 0 1rem; }
    label > span { display: block; font-weight: 600; margin-bottom: .3rem; }
    small { display: block; opacity: .7; margin-top: .2rem; }
    textarea, input[type=text], select { box-sizing: border-box; width: 100%; font: inherit; }
    textarea { min-height: 6rem; font-family: ui-monospace, monospace; }
    .check { display: flex; gap: .5rem; align-items: center; }
    #status { margin-left: .5rem; opacity: .7; }
    h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
    kbd { font-family: ui-monospace, monospace; padding: .1rem .3rem; border: 1px solid; border-radius: 3px; }
  </style>
</head>
<body>
  <form id="form">
    <label>
      <span>Terminal addresses</span>
      <textarea id="hosts" spellcheck="false"></textarea>
      <small>One per line, <code>host:port</code> as in the URL (<code>term.localhost:8080</code>).
        <code>*.localhost</code> matches all subdomains.</small>
    </label>
    <label>
      <span>Group name</span>
      <input id="title" type="text">
    </label>
    <label>
      <span>Color</span>
      <select id="color">
        <option value="grey">Grey</option>
        <option value="blue">Blue</option>
        <option value="red">Red</option>
        <option value="yellow">Yellow</option>
        <option value="green">Green</option>
        <option value="pink">Pink</option>
        <option value="purple">Purple</option>
        <option value="cyan">Cyan</option>
        <option value="orange">Orange</option>
      </select>
    </label>
    <label class="check">
      <input id="ungroupOnLeave" type="checkbox">
      Ungroup a tab that leaves the terminal
    </label>
    <h2>Open a terminal from the keyboard</h2>
    <p>Terminal: <kbd id="shortcut-open-terminal">…</kbd>, AI agent: <kbd id="shortcut-open-agent">…</kbd>
      <button type="button" id="editShortcut">Change</button></p>
    <label>
      <span>Address to open</span>
      <input id="openUrl" type="text" spellcheck="false">
    </label>
    <label class="check">
      <input id="inheritCwd" type="checkbox">
      From a terminal, open the new one in the same directory
    </label>
    <label>
      <span>AI agent command</span>
      <input id="agentCommand" type="text" spellcheck="false">
      <small>Run by the AI agent shortcut, in a new terminal (<code>claude</code>, <code>codex</code>…).</small>
    </label>
    <label>
      <span>Token</span>
      <input id="token" type="password" spellcheck="false" autocomplete="off">
      <small>Contents of <code>~/.config/mywebterm/token</code>. Optional: without it, the terminal asks
        before running the agent command. Kept on this device only.</small>
    </label>
    <button type="submit">Save and regroup</button><span id="status"></span>
  </form>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
