<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mywebterm</title>
    <link rel="icon" id="favicon" />
    <style>
      /* Replaced on load with the values from the Ghostty config */
      :root {
        --bg: #1a1b26;
        --fg: #a9b1d6;
        --accent: #7aa2f7;
        --pad-x: 8px;
        --pad-y: 8px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      /* Ghostty doesn't thicken text (font-thicken = false by default) whereas
         macOS browsers do, including in the terminal canvas. */
      body.thin {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #terminal {
        /* ghostty-web makes this container editable: without this, Firefox shows
           a blinking text caret in the top-left corner */
        caret-color: transparent;
        /* During composition (dead key ^, ¨…), the browser inserts the
           provisional text directly into this container, before the canvas: it
           shows up in the top-left corner and shifts the rendering. The
           container's text must therefore take no space and stay invisible (the
           terminal font is passed to ghostty-web, it doesn't inherit from here). */
        font-size: 0;
        line-height: 0;
        color: transparent;
        outline: none;
        position: fixed;
        inset: 0;
        padding: var(--pad-y) var(--pad-x);
      }
      #bar {
        position: fixed;
        top: 6px;
        right: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
        font: 12px system-ui, sans-serif;
        color: var(--fg);
        opacity: 0.5;
        transition: opacity 0.15s;
      }
      #bar:hover,
      #bar:focus-within {
        opacity: 1;
      }
      #title {
        cursor: text;
        padding: 2px 6px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--fg) 12%, var(--bg));
      }
      #notify-btn {
        font: inherit;
        color: inherit;
        background: color-mix(in srgb, var(--fg) 12%, var(--bg));
        border: none;
        border-radius: 4px;
        padding: 2px 6px;
        cursor: pointer;
      }
      #notify-btn[hidden] {
        display: none;
      }
      #title-input {
        font: inherit;
        color: inherit;
        background: color-mix(in srgb, var(--fg) 12%, var(--bg));
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 1px 5px;
        outline: none;
        width: 16em;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="bar">
      <span id="status">connecting…</span>
      <button id="notify-btn" hidden title="Get notified when an agent finishes or asks a question">🔔 Enable notifications</button>
      <span id="title" title="Rename (Ctrl+Shift+R)"></span>
    </div>

    <script type="module">
      import { init, Terminal, FitAddon } from '/ghostty-web/ghostty-web.js';

      const statusEl = document.getElementById('status');
      const titleEl = document.getElementById('title');
      const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
      titleEl.title = `Rename (${isMac ? 'Cmd' : 'Ctrl'}+Shift+R)`;

      // --- Token -------------------------------------------------------------
      // Required by the server (see server.js). Given once per address as
      // #token=…, then kept in localStorage; removed from the address right
      // away so it doesn't end up in a bookmark or a shared link.
      const TOKEN_KEY = 'mywebterm-token';
      const hashToken = new URLSearchParams(location.hash.slice(1)).get('token');
      if (hashToken) {
        try {
          localStorage.setItem(TOKEN_KEY, hashToken);
        } catch {
          // storage blocked: the token only lasts for this page
        }
        history.replaceState(null, '', location.pathname + location.search);
      }
      let token = hashToken;
      try {
        token ||= localStorage.getItem(TOKEN_KEY);
      } catch {
        // storage blocked
      }

      // The URL path is the starting directory: /~/Dev/project, /Users/me/Dev…
      const cwdPath = decodeURIComponent(location.pathname);

      // --- Tab title ---------------------------------------------------------
      // Priority: name set by hand (kept in ?title=) > running program among
      // PROGRAMS > automatic title. The automatic title starts from the URL
      // directory, then follows the shell's latest signal: directory change
      // (OSC 7) or explicit title (OSC 0/2).
      let manualTitle = new URLSearchParams(location.search).get('title') || '';
      // { label, keepsOwnTitle, ownTitle, icon } of the running program, or null
      let runningProgram = null;
      // Title of the AI agent relaunched by ?c=, kept in ?t=: shown as soon as
      // it starts, before it sends its own
      const restoredOwnTitle = new URLSearchParams(location.search).get('t') || '';
      const restoredCommand = new URLSearchParams(location.search).get('c') || '';
      let autoTitle = restoredOwnTitle || cwdPath.replace(/\/+$/, '').split('/').pop() || '~';
      let home = '';

      function setAutoTitle(title) {
        autoTitle = title;
        renderTitle();
      }

      function renderTitle() {
        const program = runningProgram && (runningProgram.ownTitle || runningProgram.label);
        const title = manualTitle || program || autoTitle;
        // "●": notification not seen yet (see Notifications)
        document.title = unread ? `● ${title}` : title;
        titleEl.textContent = title;
        renderFavicon(runningProgram?.icon);
      }

      // --- Favicon -----------------------------------------------------------
      // Command prompt in the theme colors by default, otherwise the running
      // program's logo or emoji, with a badge while a notification hasn't been
      // seen. Converted to PNG: Safari ignores SVG favicons.
      const faviconEl = document.getElementById('favicon');
      const faviconCache = new Map();
      let faviconColors = { bg: '#1a1b26', fg: '#a9b1d6', accent: '#9ece6a', badge: '#f7768e' };
      let currentIcon;

      function svgUrl(svg) {
        return `data:image/svg+xml,${encodeURIComponent(svg)}`;
      }

      function iconSource(icon) {
        if (!icon) {
          const { bg, fg, accent } = faviconColors;
          return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <rect width="32" height="32" rx="7" fill="${bg}" stroke="${fg}" stroke-opacity=".35"/>
            <path d="M8 10l6 6-6 6" fill="none" stroke="${accent}" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 23h8" stroke="${fg}" stroke-width="3" stroke-linecap="round"/>
          </svg>`);
        }
        if (/^[a-z0-9]+$/.test(icon)) return `/icons/${icon}.svg`;
        return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <text x="16" y="17" font-size="26" text-anchor="middle" dominant-baseline="central">${icon}</text>
        </svg>`);
      }

      async function renderFavicon(icon) {
        const key = (icon || `default:${Object.values(faviconColors)}`) + (unread ? ':unread' : '');
        if (key === currentIcon) return;
        currentIcon = key;
        if (!faviconCache.has(key)) {
          const img = new Image();
          img.src = iconSource(icon);
          try {
            await img.decode();
          } catch {
            return; // logo not found: keep the current icon
          }
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 64, 64);
          if (unread) {
            ctx.beginPath();
            ctx.arc(50, 14, 13, 0, 2 * Math.PI);
            ctx.fillStyle = faviconColors.badge;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = faviconColors.bg;
            ctx.stroke();
          }
          faviconCache.set(key, canvas.toDataURL('image/png'));
        }
        // Another change may have come in while loading
        if (currentIcon === key) faviconEl.href = faviconCache.get(key);
      }

      // --- Notifications -----------------------------------------------------
      // Sent by OSC 9, 777 and 99 sequences (AI agents, `notify` command,
      // bin/claude-notify-hook). Only when the tab isn't being looked at
      // (hidden tab or window in the background): browser notification, plus
      // "●" before the title and a badge on the favicon until the tab is
      // revisited, even without permission.
      const notifyBtn = document.getElementById('notify-btn');
      // One notification at a time per tab: the next one replaces the previous
      const notificationTag = `mywebterm-${Math.random().toString(36).slice(2)}`;
      let unread = false;
      let notification = null;

      function watched() {
        return document.visibilityState === 'visible' && document.hasFocus();
      }

      // title: "Claude is done"…; empty = tab title only
      function notify(title, body) {
        if (watched()) return;
        if (!unread) {
          unread = true;
          renderTitle();
        }
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const tabTitle = titleEl.textContent;
        const n = new Notification(title ? `${title} · ${tabTitle}` : tabTitle, {
          body,
          tag: notificationTag,
          renotify: true,
          icon: faviconEl.href || undefined,
        });
        n.onclick = () => {
          window.focus();
          n.close();
        };
        notification = n;
      }

      function markRead() {
        if (!watched()) return;
        notification?.close();
        notification = null;
        if (!unread) return;
        unread = false;
        renderTitle();
      }
      window.addEventListener('focus', markRead);
      document.addEventListener('visibilitychange', markRead);

      // Safari and Firefox only grant permission on a user gesture: the button
      // is shown as long as it has been neither granted nor denied
      function renderNotifyButton() {
        notifyBtn.hidden = !('Notification' in window) || Notification.permission !== 'default';
      }
      notifyBtn.addEventListener('click', async () => {
        await Notification.requestPermission();
        renderNotifyButton();
        document.getElementById('terminal').focus();
      });
      renderNotifyButton();

      // kitty: ESC ] 99 ; i=1:d=0:p=title ; <text>. Title and body may arrive
      // in several sequences (d=0: more to come), base64-encoded if e=1.
      // The rest of the protocol (icons, buttons, p=? queries) is ignored.
      const kittyPending = new Map();
      function kittyNotification(payload) {
        const sep = payload.indexOf(';');
        if (sep === -1) return;
        const meta = Object.fromEntries(
          payload.slice(0, sep).split(':').filter(Boolean).map((pair) => pair.split('=')),
        );
        if (meta.p === '?') return;
        let text = payload.slice(sep + 1);
        if (meta.e === '1') {
          try {
            text = new TextDecoder().decode(Uint8Array.from(atob(text), (c) => c.charCodeAt(0)));
          } catch {
            return;
          }
        }
        const id = meta.i ?? '';
        const parts = kittyPending.get(id) ?? { title: '', body: '' };
        const kind = meta.p ?? 'title';
        if (kind === 'title' || kind === 'body') parts[kind] += text;
        if (meta.d === '0') {
          kittyPending.set(id, parts);
          return;
        }
        kittyPending.delete(id);
        if (parts.body) notify(parts.title, parts.body);
        else if (parts.title) notify('', parts.title);
      }

      // Empty string = back to the automatic title
      function setManualTitle(title) {
        manualTitle = title.trim();
        const url = new URL(location.href);
        if (manualTitle) url.searchParams.set('title', manualTitle);
        else url.searchParams.delete('title');
        history.replaceState(null, '', url);
        renderTitle();
      }

      // Current directory → URL path (/~/… under home), so that a reload or
      // a bookmark reopens the shell in the same place.
      // The root stays "/": that path means home.
      function setUrlPath(dir) {
        if (!dir) return;
        const relative = dir === home ? '~' : dir.startsWith(`${home}/`) ? `~${dir.slice(home.length)}` : dir.slice(1);
        const url = new URL(location.href);
        url.pathname = `/${relative.split('/').map(encodeURIComponent).join('/')}`;
        if (url.href !== location.href) history.replaceState(null, '', url);
      }

      // Running program → ?c=: a reload or a bookmark relaunches it.
      // Empty string = back at the prompt, the parameter is removed.
      function setUrlCommand(commandLine) {
        setUrlParams({ command: '', c: commandLine.trim(), t: commandLine ? undefined : '' });
      }

      // Title of the running AI agent → ?t=, next to its command in ?c=
      function setUrlOwnTitle(title) {
        if (new URL(location.href).searchParams.has('c')) setUrlParams({ t: title });
      }

      // { name: value }; '' removes the parameter, undefined leaves it alone
      function setUrlParams(changes) {
        const url = new URL(location.href);
        for (const [name, value] of Object.entries(changes)) {
          if (value === undefined) continue;
          if (value) url.searchParams.set(name, value);
          else url.searchParams.delete(name);
        }
        if (url.href !== location.href) history.replaceState(null, '', url);
      }

      function startRename() {
        const input = document.createElement('input');
        input.id = 'title-input';
        input.value = manualTitle;
        input.placeholder = `${autoTitle} (empty = automatic)`;
        titleEl.replaceWith(input);
        input.focus();
        input.select();

        let done = false;
        const finish = (commit) => {
          if (done) return;
          done = true;
          if (commit) setManualTitle(input.value);
          input.replaceWith(titleEl);
          term.focus();
        };
        input.addEventListener('keydown', (e) => {
          e.stopPropagation();
          if (e.key === 'Enter') finish(true);
          if (e.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
      }

      renderTitle();

      // --- Sequences sent by the shell ---------------------------------------
      // - ESC ] 6767 ; title ; <name> BEL: `title` command (bin/title)
      // - ESC ] 6767 ; command ; <line> BEL: command started (shell-integration/zsh)
      // - ESC ] 6767 ; resume ; <line> BEL: command that resumes the running AI
      //   agent's session (shell-integration/zsh)
      // - ESC ] 6767 ; prompt BEL: back at the prompt, the command has finished
      // - ESC ] 7 ; file://<host><path> BEL: current directory, sent at every
      //   prompt by shell-integration/zsh
      // - ESC ] 9 ; <message> BEL (iTerm2), ESC ] 777 ; notify ; <title> ; <message> BEL
      //   (rxvt, Ghostty), ESC ] 99 ; … (kitty): notification, see Notifications
      // They are stripped from the stream before it goes to the terminal.
      const HANDLERS = {
        '\x1b]6767;': (payload) => {
          const [cmd, ...args] = payload.split(';');
          if (cmd === 'title') setManualTitle(args.join(';'));
          if (cmd === 'command') {
            const commandLine = args.join(';');
            const { program, args: programArgs } = parseCommand(commandLine);
            const entry = PROGRAMS[program];
            setUrlCommand(entry && entry.inUrl !== false ? commandLine : '');
            runningProgram = entry && {
              label: entry.title === 'ssh' ? sshLabel(programArgs) : program,
              keepsOwnTitle: entry.title === 'own',
              // Command relaunched from the URL: reuse its last title
              ownTitle: entry.title === 'own' && commandLine.trim() === restoredCommand.trim() ? restoredOwnTitle : '',
              icon: entry.icon,
            };
            if (runningProgram?.ownTitle) setUrlOwnTitle(runningProgram.ownTitle);
            renderTitle();
          }
          // AI agent started with a session ID: its resume command
          // (`claude --resume <id>`) replaces the typed line
          if (cmd === 'resume' && runningProgram) setUrlCommand(args.join(';'));
          if (cmd === 'prompt') setUrlCommand('');
          if (cmd === 'prompt' && runningProgram) {
            runningProgram = null;
            renderTitle();
          }
        },
        // 9;4;… (progress bar) and the other ConEmu subcommands: ignored
        '\x1b]9;': (payload) => {
          if (!/^\d+;/.test(payload)) notify('', payload);
        },
        '\x1b]777;': (payload) => {
          const [cmd, title = '', ...body] = payload.split(';');
          if (cmd === 'notify') notify(title, body.join(';'));
        },
        '\x1b]99;': kittyNotification,
        '\x1b]7;': (payload) => {
          let path = payload.replace(/^file:\/\/[^/]*/, '');
          try {
            path = decodeURIComponent(path);
          } catch {
            // unencoded path containing a "%": keep it as is
          }
          const trimmed = path.replace(/\/+$/, '');
          setAutoTitle(!trimmed || trimmed === home ? '~' : trimmed.split('/').pop());
          // Under ssh, the reported directory is on the remote machine
          if (!runningProgram?.label.startsWith('ssh')) setUrlPath(trimmed);
        },
      };
      let pending = '';

      // Programs recognized while they run (until the prompt comes back).
      // title: what the tab shows, ahead of titles sent by the program
      //   - 'name' (default): the program name
      //   - 'own': the title sent by the program if it sends one (AI agents
      //            summarize the session in it), otherwise its name
      //   - 'ssh': "ssh <host>"
      // icon: favicon, simple-icons slug (logo served by /icons/) or emoji
      // inUrl: false: don't keep the command in the URL (?c=), it often
      //   contains a password (postgres://me:secret@…)
      const PROGRAMS = {
        // Multiplexers and connections
        tmux: { icon: 'tmux' },
        herdr: { icon: '🐑' },
        zellij: { icon: '🪟' },
        screen: { icon: '🖥️' },
        ssh: { title: 'ssh', icon: '🔐' },
        // AI agents
        claude: { title: 'own', icon: 'claude' },
        opencode: { title: 'own', icon: 'opencode' },
        codex: { title: 'own', icon: '🤖' },
        aider: { title: 'own', icon: '🤖' },
        pi: { title: 'own', icon: 'π' },
        gemini: { title: 'own', icon: 'googlegemini' },
        // Editors
        vim: { icon: 'vim' },
        nvim: { icon: 'neovim' },
        emacs: { icon: 'gnuemacs' },
        nano: { icon: '📝' },
        hx: { icon: 'helix' },
        micro: { icon: '📝' },
        // Git, containers, files
        lazygit: { icon: 'git' },
        tig: { icon: 'git' },
        gitui: { icon: 'git' },
        lazydocker: { icon: 'docker' },
        k9s: { icon: 'kubernetes' },
        yazi: { icon: '📁' },
        ranger: { icon: '📁' },
        gdu: { icon: '💾' },
        ncdu: { icon: '💾' },
        // Monitoring
        htop: { icon: 'htop' },
        btop: { icon: '📊' },
        top: { icon: '📊' },
        // Databases and consoles
        psql: { icon: 'postgresql', inUrl: false },
        pgcli: { icon: 'postgresql', inUrl: false },
        sqlite3: { icon: 'sqlite' },
        python3: { icon: 'python' },
        node: { icon: 'nodedotjs' },
        // Documentation
        man: { icon: '📖' },
        bat: { icon: '🦇' },
      };
      const WRAPPERS = ['command', 'exec', 'nocorrect', 'noglob', 'time', 'sudo', 'env', 'nohup'];

      // `FOO=1 command /opt/bin/tmux new -s x` → { program: 'tmux', args: ['new', '-s', 'x'] }
      function parseCommand(commandLine) {
        const words = commandLine.trim().split(/\s+/);
        const index = words.findIndex((w) => !/^\w+=/.test(w) && !WRAPPERS.includes(w));
        if (index === -1) return { program: '', args: [] };
        return { program: words[index].split('/').pop(), args: words.slice(index + 1) };
      }

      // ssh options followed by a value (man ssh)
      const SSH_OPTIONS_WITH_VALUE = 'BbcDEeFIiJLlmOoPpQRSWw';

      // `ssh -p 22 -i key me@prod-1 uptime` → "ssh prod-1"
      function sshLabel(args) {
        for (let i = 0; i < args.length; i++) {
          const arg = args[i];
          if (arg.startsWith('-') && arg.length > 1) {
            // Grouped options (-tt, -vp22): the first one that expects a value
            // takes it from the rest of the word, or from the next word
            for (let j = 1; j < arg.length; j++) {
              if (SSH_OPTIONS_WITH_VALUE.includes(arg[j])) {
                if (j === arg.length - 1) i++;
                break;
              }
            }
            continue;
          }
          const host = arg.replace(/^ssh:\/\//, '').replace(/^.*@/, '').replace(/:\d+$/, '');
          return `ssh ${host}`;
        }
        return 'ssh';
      }

      // Next intercepted sequence in data, or null
      function findSequence(data) {
        let found = null;
        for (const prefix in HANDLERS) {
          const start = data.indexOf(prefix);
          if (start !== -1 && (!found || start < found.start)) found = { start, prefix };
        }
        return found;
      }

      function extractCommands(data) {
        data = pending + data;
        pending = '';
        let out = '';
        let seq;
        while ((seq = findSequence(data))) {
          out += data.slice(0, seq.start);
          // End of sequence: BEL or ESC \
          const rest = data.slice(seq.start + seq.prefix.length);
          const match = /\x07|\x1b\\/.exec(rest);
          if (!match) {
            // Sequence split across two messages: wait for the rest
            pending = data.slice(seq.start);
            return out;
          }
          HANDLERS[seq.prefix](rest.slice(0, match.index));
          data = rest.slice(match.index + match[0].length);
        }
        return out + data;
      }

      // --- Terminal ----------------------------------------------------------
      const config = await fetch('/config.json').then((r) => r.json());
      home = config.home;
      // 13 = Ghostty's default size on macOS
      const fontSize = config.fontSize ?? 13;
      document.body.classList.toggle('thin', !config.fontThicken);

      // Fonts from the Ghostty config. Files found on the system are served by
      // the server (Safari ignores user-installed fonts) under an alias;
      // otherwise the name is tried as is.
      const fontFamily = config.fonts
        .map(({ family, faces }, i) => {
          if (!faces.length) return `"${family}"`;
          for (const face of faces) {
            const src = `url(${face.url}) format("${face.format}")`;
            const descriptors = { weight: String(face.weight), style: face.style };
            document.fonts.add(new FontFace(`TermFont${i}`, src, descriptors));
          }
          return `TermFont${i}`;
        })
        .concat('Menlo', 'monospace')
        .join(', ');

      // The terminal measures cell size when it opens: the font must be loaded
      // first, otherwise measurements are made with the fallback font.
      const variants = ['', 'bold ', 'italic ', 'bold italic '];
      await Promise.all([
        init(),
        ...variants.map((v) => document.fonts.load(`${v}${fontSize}px ${fontFamily}`)),
      ]);

      // Ghostty theme ("light:…,dark:…" follows the system light/dark mode)
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = config.themes[dark ? 'dark' : 'light'];
      const rootStyle = document.documentElement.style;
      if (theme.background) rootStyle.setProperty('--bg', theme.background);
      if (theme.foreground) rootStyle.setProperty('--fg', theme.foreground);
      if (theme.blue) rootStyle.setProperty('--accent', theme.blue);
      faviconColors = {
        bg: theme.background ?? faviconColors.bg,
        fg: theme.foreground ?? faviconColors.fg,
        accent: theme.green ?? faviconColors.accent,
        badge: theme.red ?? faviconColors.badge,
      };
      renderTitle();
      if (config.paddingX !== undefined) rootStyle.setProperty('--pad-x', `${config.paddingX}px`);
      if (config.paddingY !== undefined) rootStyle.setProperty('--pad-y', `${config.paddingY}px`);

      const term = new Terminal({
        fontSize,
        fontFamily,
        cursorBlink: true,
        theme,
      });

      const fit = new FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('terminal'));
      fit.fit();
      fit.observeResize();
      term.focus();

      titleEl.addEventListener('click', startRename);
      term.onTitleChange((title) => {
        // AI agents prefix their title with a status symbol ("✳", braille
        // spinner "⠂"…): the favicon replaces it, so strip it from the tab name.
        if (runningProgram?.keepsOwnTitle) {
          runningProgram.ownTitle = title.replace(/^[^\p{L}\p{N}\s]+\s+/u, '');
          setUrlOwnTitle(runningProgram.ownTitle);
        }
        setAutoTitle(title);
      });

      // Ctrl+Shift+R (Cmd+Shift+R on macOS): rename. With ghostty-web, returning true blocks the key.
      term.attachCustomKeyEventHandler((e) => {
        if ((isMac ? e.metaKey : e.ctrlKey) && e.shiftKey && e.code === 'KeyR') {
          e.preventDefault(); // otherwise Cmd+Shift+R reloads the page
          startRename();
          return true;
        }
        // ghostty-web swallows Ctrl+V (the "paste" shortcut outside macOS). On macOS,
        // where paste is Cmd+V, pass it through: Claude Code reads the clipboard there, images included.
        if (isMac && e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && e.code === 'KeyV') {
          if (ws.readyState === WebSocket.OPEN) ws.send('\x16');
          return true;
        }
        // ghostty-web drops Shift on Tab and Enter (both send the bare key). Shift+Tab
        // is back-tab (CSI Z: Claude Code's mode switch, reverse completion);
        // Shift+Enter sends ESC CR like iTerm2 after /terminal-setup (newline in Claude Code).
        if (e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && (e.code === 'Tab' || e.code === 'Enter')) {
          if (ws.readyState === WebSocket.OPEN) ws.send(e.code === 'Tab' ? '\x1b[Z' : '\x1b\r');
          return true;
        }
        return false;
      });

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const params = new URLSearchParams({ cols: term.cols, rows: term.rows, cwd: cwdPath });
      // Startup command (?command= or ?c=), typed at the first prompt. Only
      // submitted if the server deems the navigation safe (see servePage).
      const query = new URLSearchParams(location.search);
      const startupCommand = query.get('command') ?? query.get('c');
      if (startupCommand) {
        params.set('command', startupCommand);
        if (document.documentElement.dataset.launch === 'run') params.set('run', '1');
      }
      params.set('token', token || '');
      const ws = new WebSocket(`${proto}://${location.host}/pty?${params}`);

      function askForToken(message) {
        statusEl.textContent = 'token required';
        term.write(
          `\x1b[33m${message}\x1b[0m\r\n` +
            'Open the address printed by the server at startup, or add\r\n' +
            '#token=<contents of ~/.config/mywebterm/token> to this address.\r\n',
        );
      }

      ws.onopen = () => {
        statusEl.textContent = '';
      };
      ws.onmessage = (e) => {
        const data = extractCommands(e.data);
        // ghostty-web crashes on an empty write (message reduced to a command)
        if (data) term.write(data);
      };
      ws.onclose = (e) => {
        if (e.code === 4401) {
          try {
            localStorage.removeItem(TOKEN_KEY);
          } catch {
            // storage blocked
          }
          askForToken(token ? 'Invalid token.' : 'This terminal needs its access token.');
          return;
        }
        statusEl.textContent = 'disconnected — reload the page';
        term.write('\r\n\x1b[2m[session ended]\x1b[0m\r\n');
      };

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) ws.send(data);
      });
      // ghostty-web only pastes text. An image on its own (screenshot) goes to the
      // server, which saves it and pastes its path: Claude Code then attaches it.
      document.getElementById('terminal').addEventListener('paste', (e) => {
        const items = [...(e.clipboardData?.items ?? [])];
        if (items.some((item) => item.type === 'text/plain')) return;
        const image = items.find((item) => item.kind === 'file' && item.type.startsWith('image/'))?.getAsFile();
        if (!image) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        const reader = new FileReader();
        reader.onload = () => {
          if (ws.readyState !== WebSocket.OPEN) return;
          ws.send(JSON.stringify({
            type: 'image',
            mime: image.type,
            data: reader.result.slice(reader.result.indexOf(',') + 1),
            bracketed: term.hasBracketedPaste(),
          }));
        };
        reader.readAsDataURL(image);
      }, true);
      term.onResize(({ cols, rows }) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      // --- Mouse -------------------------------------------------------------
      // ghostty-web doesn't forward the mouse to programs: when one enables it
      // (vim mouse=a, htop, tmux…), we encode clicks, motion and wheel
      // ourselves. Holding Shift keeps text selection, as in Ghostty.
      const container = document.getElementById('terminal');
      const BUTTONS = { 0: 0, 1: 1, 2: 2 }; // left, middle, right
      let pressedButton = null;
      let lastMotion = {};

      // Mode requested by the program: 9 = clicks, 1000 = clicks + releases,
      // 1002 = + drag, 1003 = any motion
      function trackingMode() {
        for (const mode of [1003, 1002, 1000, 9]) if (term.getMode(mode)) return mode;
        return 0;
      }

      function captures(e) {
        return trackingMode() !== 0 && !e.shiftKey;
      }

      // Cell (1-based) under the pointer, clamped to the screen
      function cellAt(e) {
        const rect = container.querySelector('canvas').getBoundingClientRect();
        const col = Math.floor(((e.clientX - rect.left) / rect.width) * term.cols) + 1;
        const row = Math.floor(((e.clientY - rect.top) / rect.height) * term.rows) + 1;
        return {
          col: Math.min(Math.max(col, 1), term.cols),
          row: Math.min(Math.max(row, 1), term.rows),
        };
      }

      // button: 0-2 buttons, 3 = none, 64/65 = wheel; +32 for motion
      function sendMouse(button, e, release = false) {
        if (ws.readyState !== WebSocket.OPEN) return;
        const code = button + (e.shiftKey ? 4 : 0) + (e.altKey ? 8 : 0) + (e.ctrlKey ? 16 : 0);
        const { col, row } = cellAt(e);
        if (term.getMode(1006)) {
          ws.send(`\x1b[<${code};${col};${row}${release ? 'm' : 'M'}`);
        } else if (col <= 223 && row <= 223) {
          // Legacy format: one byte per value, release = button 3
          const b = release ? 3 + (code & ~3) : code;
          ws.send(`\x1b[M${String.fromCharCode(32 + b, 32 + col, 32 + row)}`);
        }
      }

      // Capture phase on the container: we run before the canvas listeners
      // (selection, context menu) and block them when the mouse is captured.
      container.addEventListener(
        'mousedown',
        (e) => {
          if (!captures(e) || !(e.button in BUTTONS)) return;
          e.preventDefault();
          e.stopPropagation();
          term.focus();
          pressedButton = BUTTONS[e.button];
          sendMouse(pressedButton, e);
        },
        true,
      );

      // On window: the release counts even outside the terminal
      window.addEventListener(
        'mouseup',
        (e) => {
          if (pressedButton === null) return;
          const mode = trackingMode();
          if (mode && mode !== 9) sendMouse(pressedButton, e, true);
          pressedButton = null;
          e.stopPropagation();
        },
        true,
      );

      window.addEventListener(
        'mousemove',
        (e) => {
          const mode = trackingMode();
          const dragging = pressedButton !== null && (mode === 1002 || mode === 1003);
          const hovering = mode === 1003 && container.contains(e.target);
          if (!dragging && !hovering) return;
          const { col, row } = cellAt(e);
          // Only one event per cell
          if (col === lastMotion.col && row === lastMotion.row) return;
          lastMotion = { col, row };
          sendMouse((pressedButton ?? 3) + 32, e);
        },
        true,
      );

      container.addEventListener(
        'contextmenu',
        (e) => {
          if (captures(e)) {
            e.preventDefault();
            e.stopPropagation();
          }
        },
        true,
      );

      // Wheel: one event per scrolled line (trackpads send small deltas, so
      // they are accumulated)
      let wheelRemainder = 0;
      term.attachCustomWheelEventHandler((e) => {
        if (!captures(e)) return false;
        const lineHeight = container.querySelector('canvas').getBoundingClientRect().height / term.rows;
        const lines =
          e.deltaMode === WheelEvent.DOM_DELTA_LINE ? e.deltaY
          : e.deltaMode === WheelEvent.DOM_DELTA_PAGE ? e.deltaY * term.rows
          : e.deltaY / lineHeight;
        wheelRemainder += lines;
        const steps = Math.trunc(wheelRemainder);
        wheelRemainder -= steps;
        for (let i = 0; i < Math.min(Math.abs(steps), 10); i++) sendMouse(steps < 0 ? 64 : 65, e);
        return true;
      });
    </script>
  </body>
</html>
